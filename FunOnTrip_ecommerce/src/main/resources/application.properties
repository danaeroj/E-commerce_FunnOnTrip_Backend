spring.application.name=FunOnTrip_ecommerce
#Información para conectarse al servidor
spring.datasource.url=jdbc:mysql://${PROD_DB_HOST}:3306/${PROD_DB_NAME}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}

# create, create-drop, validate, update
spring.jpa.hibernate.ddl-auto=${PROD_DDL}

# Flyway desactivado para no interferir
spring.flyway.enabled=false

jwt.secret=FUNONTRIP_EXPLORA_EL_MUNDO_Y_VIVE_LA_AVENTURA_123456
jwt.expirationMinutes=1440
